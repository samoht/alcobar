name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 4.08 is the lower bound in dune-project; 4.14 is the last 4.x. The
        # PRNG differs between 4.x and 5.x, so tests that pass on one line of
        # compilers can fail on the other.
        ocaml-compiler: ['4.08', '4.14', '5.4']

    steps:
      - uses: actions/checkout@v5

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build
      - run: opam exec -- dune runtest
